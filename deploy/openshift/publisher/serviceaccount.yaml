# Identity for the operator-driven publisher toolbox: no Kubernetes API access (no Role/RoleBinding), no token.
# The human operator uses `oc cp` / `oc exec` with their own credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mias-publisher
  namespace: mias
  labels:
    app.kubernetes.io/name: mias-publisher
    app.kubernetes.io/part-of: mias
automountServiceAccountToken: false

apiVersion: v1
kind: Service
metadata:
  name: mias-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-api
    {{- include "mias.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mias-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

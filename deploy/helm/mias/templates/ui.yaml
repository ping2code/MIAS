{{- if .Values.ui.enabled }}
# mias-ui (Phase 16B): static dashboard + same-origin nginx proxy to mias-api. No token, Secret, RBAC or Kubernetes
# API access; restricted-v2, read-only root, writable /tmp only. Hardening Task 8: the ServiceAccount is also the
# OAuth client of the oauth-proxy sidecar (its redirect URIs come from Route mias-ui); only the proxy container gets
# a (projected) token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mias-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
  {{- if include "mias.uiOAuthActive" . }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mias-ui"}}'
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mias-ui-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
data:
  MIAS_UI_API_UPSTREAM: {{ include "mias.uiUpstream" . | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mias-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    app.kubernetes.io/component: dashboard
    {{- with .Values.ui.image.versionLabel }}
    app.kubernetes.io/version: {{ . | quote }}
    {{- end }}
    {{- include "mias.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  # Stateless (no volume claim): a new pod becomes ready before the old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mias-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mias-ui
        app.kubernetes.io/part-of: mias
        app.kubernetes.io/component: dashboard
      annotations:
        checksum/config: {{ include "mias.uiUpstream" . | sha256sum }}
    spec:
      serviceAccountName: mias-ui
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      {{- if .Values.ui.topologySpread.enabled }}
      {{- if not (has .Values.ui.topologySpread.whenUnsatisfiable (list "DoNotSchedule" "ScheduleAnyway")) }}
      {{- fail "ui.topologySpread.whenUnsatisfiable must be DoNotSchedule or ScheduleAnyway" }}
      {{- end }}
      # One UI pod per worker where possible. Tainted nodes (the masters) are not counted as empty domains, and
      # pod-template-hash scopes the spread to one ReplicaSet, so each rollout's new pods spread among themselves.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.ui.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mias-ui
          matchLabelKeys:
            - pod-template-hash
          nodeTaintsPolicy: Honor
      {{- end }}
      securityContext:
        {{- include "mias.podSecurityContext" . | nindent 8 }}
      containers:
        - name: mias-ui
          image: {{ include "mias.uiImage" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: mias-ui-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- include "mias.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          # /healthz is static in nginx: UI health never depends on the API.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if include "mias.uiOAuthActive" . }}
        # Hardening Task 8: OpenShift OAuth for the UI. Signed stateless session cookie (shared Secret), access only
        # for users who may get services/mias-ui here, /healthz left open for the synthetic probe. No basic auth or
        # OAuth access token is passed upstream; request logging stays off (it would record the OAuth callback code).
        - name: oauth-proxy
          image: {{ include "mias.oauthProxyImage" . }}
          imagePullPolicy: {{ .Values.ui.oauth.image.pullPolicy }}
          args:
            - "--provider=openshift"
            - {{ printf "--http-address=0.0.0.0:%v" .Values.ui.oauth.port | quote }}
            - "--https-address="
            - "--upstream=http://127.0.0.1:8080"
            - "--openshift-service-account=mias-ui"
            - {{ printf "--redirect-url=https://%s/oauth/callback" .Values.ui.route.host | quote }}
            - {{ printf "--openshift-sar=%s" (include "mias.oauthSAR" .) | quote }}
            - "--skip-auth-regex=^/healthz$"
            - "--skip-provider-button=true"
            - "--cookie-secret-file=/etc/oauth-proxy/cookie/session_secret"
            - {{ printf "--cookie-name=%s" .Values.ui.oauth.cookieName | quote }}
            - "--cookie-secure=true"
            - "--cookie-httponly=true"
            - "--cookie-samesite=lax"
            - {{ printf "--cookie-expire=%s" .Values.ui.oauth.cookieExpire | quote }}
            - "--pass-basic-auth=false"
            - "--pass-user-headers=false"
            - "--pass-access-token=false"
            - "--request-logging=false"
          ports:
            - name: oauth
              containerPort: {{ .Values.ui.oauth.port }}
              protocol: TCP
          securityContext:
            {{- include "mias.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.oauth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: oauth-sa
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/oauth-proxy/cookie
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.ui.tmp.sizeLimit }}
        {{- if include "mias.uiOAuthActive" . }}
        # The OAuth client secret: a bound ServiceAccount token for the proxy container only (3607 s is the API
        # server's default-token request, which it extends), plus the cluster CA bundle and the namespace.
        - name: oauth-sa
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: oauth-cookie
          secret:
            secretName: {{ .Values.ui.oauth.cookieSecret }}
            items:
              - key: session_secret
                path: session_secret
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mias-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mias-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if include "mias.uiOAuthActive" . }}
    - name: oauth
      port: {{ .Values.ui.oauth.port }}
      targetPort: oauth
      protocol: TCP
    {{- end }}
{{- if and .Values.ui.pdb.enabled (ge (int .Values.ui.replicaCount) 2) }}
---
# Hardening Task 5: voluntary disruptions (node drains, evictions) may take at most one of the UI pods at a time.
# Pods that are not Ready may always be evicted, so a broken pod never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mias-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.ui.pdb.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: mias-ui
{{- end }}
{{- if .Values.ui.route.enabled }}
---
# Edge TLS at the router; HTTP redirected to HTTPS. No router sticky cookie: the UI is static and its session lives in
# browser memory, so session affinity is unnecessary at any replica count. Hardening Task 7: optional HSTS and an
# out-of-band certificate Secret, as for the API Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mias-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
    {{- with .Values.routeTLS.hsts }}
    haproxy.router.openshift.io/hsts_header: {{ . | quote }}
    {{- end }}
spec:
  host: {{ .Values.ui.route.host }}
  to:
    kind: Service
    name: mias-ui
    weight: 100
  port:
    # Hardening Task 8: with ui.oauth.routeMode=full every UI request goes through the oauth-proxy sidecar.
    targetPort: {{ if and (include "mias.uiOAuthActive" .) (eq .Values.ui.oauth.routeMode "full") }}oauth{{ else }}http{{ end }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    {{- with .Values.ui.route.tls.externalCertificateSecret }}
    externalCertificate:
      name: {{ . }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# mias-ui accepts only the OpenShift router, on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mias-ui-allow-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mias-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        {{- if or (not (include "mias.uiOAuthActive" .)) (eq .Values.ui.oauth.routeMode "path") }}
        - protocol: TCP
          port: 8080
        {{- end }}
        {{- if include "mias.uiOAuthActive" . }}
        - protocol: TCP
          port: {{ .Values.ui.oauth.port }}
        {{- end }}
---
# mias-ui may reach only mias-api on 8080, plus cluster DNS to resolve the Service name. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mias-ui-egress-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-ui
    {{- include "mias.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mias-ui
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mias-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
---
# mias-api additionally accepts mias-ui pods on 8080 (alongside mias-api-allow-router; policies are additive).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mias-api-allow-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-api
    {{- include "mias.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mias-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mias-ui
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}

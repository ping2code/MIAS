{{- if .Values.route.enabled }}
# Edge TLS at the router; HTTP redirected to HTTPS. No router sticky cookie: the API is stateless (bearer auth per
# request), so session affinity is unnecessary at any replica count.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mias-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-api
    {{- include "mias.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: mias-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}

{{- if .Values.route.enabled }}
# Edge TLS at the router; HTTP redirected to HTTPS. No router sticky cookie: the API is stateless (bearer auth per
# request), so session affinity is unnecessary at any replica count. Hardening Task 7: optional HSTS, and the MIAS
# certificate from an out-of-band Secret (read by the router through templates/route-tls-rbac.yaml).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mias-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-api
    {{- include "mias.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
    {{- with .Values.routeTLS.hsts }}
    haproxy.router.openshift.io/hsts_header: {{ . | quote }}
    {{- end }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: mias-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    {{- with .Values.route.tls.externalCertificateSecret }}
    externalCertificate:
      name: {{ . }}
    {{- end }}
  wildcardPolicy: None
{{- end }}

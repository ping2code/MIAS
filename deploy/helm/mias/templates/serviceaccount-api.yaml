# Workload identity for mias-api: no Kubernetes API access (no Role/RoleBinding) and no mounted token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mias-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mias-api
    {{- include "mias.labels" . | nindent 4 }}
automountServiceAccountToken: false

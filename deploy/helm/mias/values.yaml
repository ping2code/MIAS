# Defaults reproduce the validated Phase 14C/14D deployment plus the Phase 14E hardening. No secret values belong
# here: the read token lives in an externally managed Secret (existingSecret).

image:
  # Exact digest pinning: the API and the publisher always run this same image. No tags, no "latest".
  repository: image-registry.openshift-image-registry.svc:5000/mias/mias-api
  digest: sha256:634c5372e95b6d2fc1a5e194d3ea841e60f6ae336fbc90f65f54f3e46d32b196
  versionLabel: 259236684a74          # app.kubernetes.io/version only; never used to pull (git 259236684a74…)
  pullPolicy: IfNotPresent

existingSecret:
  # Created out of band (see docs/phase14c-openshift-baseline.md); the chart only references it.
  name: mias-api-auth
  key: MIAS_API_READ_TOKEN

api:
  replicaCount: 1                     # RWO storage: one replica, Recreate strategy
  docsEnabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

publisher:
  replicaCount: 0                     # operator toolbox: scale to 1 only while publishing
  sameNodeAsApi: true                 # required podAffinity to the mias-api pod's node (RWO volume)
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

artifact:
  mountPath: /var/lib/mias/artifacts

persistence:
  enabled: true                       # true: the chart manages the PVC (kept on uninstall); false: use an existing claim
  pvc:
    name: mias-artifacts
    size: 1Gi
    storageClass: thin-csi

podSecurity:
  # OnRootMismatch: the kubelet re-applies fsGroup ownership/permissions only if the volume root does not already
  # match, instead of recursively on every mount (which turned published 0444 artifacts into 0664). "" omits it.
  fsGroupChangePolicy: OnRootMismatch

tmp:
  sizeLimit: 64Mi

route:
  enabled: true
  host: mias-api.apps.ngc.sirii.org

networkPolicy:
  enabled: true                       # default-deny for MIAS pods; the API accepts only router traffic on 8080

observability:
  # Phase 15: OpenTelemetry traces + metrics from mias-api over OTLP/HTTP to the in-namespace collector, and JSON
  # logs on stdout. Telemetry is auxiliary: the API keeps serving if the collector is down.
  enabled: true
  serviceName: mias-api
  environment: lab
  logging:
    json: true
  traces:
    enabled: true
  metrics:
    enabled: true
    exportIntervalMs: 60000
  otlp:
    protocol: http/protobuf           # the only protocol the API image ships an exporter for
    endpoint: ""                       # empty: the in-namespace collector Service (http://otel-collector.<ns>.svc:4318)
  collector:
    enabled: true
    image:
      # Upstream otel/opentelemetry-collector-contrib 0.161.0 (Docker Hub index sha256:b5cf9836…), mirrored to the
      # internal registry (amd64 manifest). Digest-pinned like the API image.
      repository: image-registry.openshift-image-registry.svc:5000/mias/otel-collector-contrib
      digest: sha256:2d75615700fdecd6981f7b352f155f3f4db74d884d73f5d92049ad4b69b41aef
      pullPolicy: IfNotPresent
    # No trace backend exists in the cluster yet: traces end at a low-verbosity debug exporter (one summary line
    # per sampled batch). Replace with a Tempo/OTLP exporter when a backend is approved.
    traceDebugVerbosity: basic
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
    serviceMonitor:
      enabled: true                   # User Workload Monitoring scrapes the collector's Prometheus exporter
      interval: 30s

# Defaults reproduce the validated Phase 14C/14D deployment plus the Phase 14E hardening. No secret values belong
# here: the read token lives in an externally managed Secret (existingSecret).

image:
  # Exact digest pinning: the API and the publisher always run this same image. No tags, no "latest".
  repository: image-registry.openshift-image-registry.svc:5000/mias/mias-api
  digest: sha256:634c5372e95b6d2fc1a5e194d3ea841e60f6ae336fbc90f65f54f3e46d32b196
  versionLabel: 259236684a74          # app.kubernetes.io/version only; never used to pull (git 259236684a74…)
  pullPolicy: IfNotPresent

existingSecret:
  # Created out of band (see docs/phase14c-openshift-baseline.md); the chart only references it.
  name: mias-api-auth
  key: MIAS_API_READ_TOKEN

api:
  replicaCount: 1                     # RWO storage: one replica, Recreate strategy
  docsEnabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

publisher:
  replicaCount: 0                     # operator toolbox: scale to 1 only while publishing
  sameNodeAsApi: true                 # required podAffinity to the mias-api pod's node (RWO volume)
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

artifact:
  mountPath: /var/lib/mias/artifacts

persistence:
  enabled: true                       # true: the chart manages the PVC (kept on uninstall); false: use an existing claim
  pvc:
    name: mias-artifacts
    size: 1Gi
    storageClass: thin-csi

podSecurity:
  # OnRootMismatch: the kubelet re-applies fsGroup ownership/permissions only if the volume root does not already
  # match, instead of recursively on every mount (which turned published 0444 artifacts into 0664). "" omits it.
  fsGroupChangePolicy: OnRootMismatch

tmp:
  sizeLimit: 64Mi

route:
  enabled: true
  host: mias-api.apps.ngc.sirii.org
  tls:
    # Hardening Task 7: the Route serves this certificate (issued by the MIAS lab CA, docs/tls/mias-lab-ca.crt)
    # instead of the ingress default. The kubernetes.io/tls Secret is created out of band (never in git or values);
    # see docs/hardening-tls-dns-hsts.md. Empty: fall back to the ingress controller's default certificate.
    externalCertificateSecret: mias-api-tls

# Hardening Task 7: shared transport settings for both Routes.
routeTLS:
  # Strict-Transport-Security sent by the router on HTTPS responses (haproxy.router.openshift.io/hsts_header). Staged:
  # a short max-age first, raised only after trusted TLS is proven. No includeSubDomains (other *.apps hosts are not
  # MIAS-controlled) and no preload. Empty: no HSTS.
  hsts: max-age=300

networkPolicy:
  enabled: true                       # default-deny for MIAS pods; the API accepts only router traffic on 8080

observability:
  # Phase 15: OpenTelemetry traces + metrics from mias-api over OTLP/HTTP to the in-namespace collector, and JSON
  # logs on stdout. Telemetry is auxiliary: the API keeps serving if the collector is down.
  enabled: true
  serviceName: mias-api
  environment: lab
  logging:
    json: true
  traces:
    enabled: true
  metrics:
    enabled: true
    exportIntervalMs: 60000
  otlp:
    protocol: http/protobuf           # the only protocol the API image ships an exporter for
    endpoint: ""                       # empty: the in-namespace collector Service (http://otel-collector.<ns>.svc:4318)
  collector:
    enabled: true
    image:
      # Upstream otel/opentelemetry-collector-contrib 0.161.0 (Docker Hub index sha256:b5cf9836…), mirrored to the
      # internal registry (amd64 manifest). Digest-pinned like the API image.
      repository: image-registry.openshift-image-registry.svc:5000/mias/otel-collector-contrib
      digest: sha256:2d75615700fdecd6981f7b352f155f3f4db74d884d73f5d92049ad4b69b41aef
      pullPolicy: IfNotPresent
    # No trace backend exists in the cluster yet: traces end at a low-verbosity debug exporter (one summary line
    # per sampled batch). Replace with a Tempo/OTLP exporter when a backend is approved.
    traceDebugVerbosity: basic
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
    serviceMonitor:
      enabled: true                   # User Workload Monitoring scrapes the collector's Prometheus exporter
      interval: 30s

monitoring:
  alerts:
    # Hardening Task 1: the mias-alerts PrometheusRule for User Workload Monitoring (Thanos Ruler). Additive; no
    # workload change. Thresholds are fixed in templates/prometheusrule.yaml (documented in docs/hardening-uwm-alerting.md).
    enabled: true

syntheticMonitoring:
  # Hardening Task 4: a Prometheus Blackbox Exporter probes the externally routed UI health endpoint
  # (https://<ui.route.host>/healthz) through cluster DNS, the ingress VIP, the OpenShift router and TLS. Rendered
  # only while the UI and its Route are enabled. The exporter runs in its own namespace, created out of band (see
  # docs/hardening-synthetic-monitoring.md); the Probe and the MiasUiSyntheticFailing alert live in the release
  # namespace, because UWM enforces the namespace label on probe metrics and alert rules.
  enabled: true
  namespace: mias-monitoring
  image:
    # quay.io/prometheus/blackbox-exporter:v0.28.0 (index sha256:43027b43…, amd64 config sha256:2bb660d6…), mirrored
    # to the mias-monitoring ImageStream and pinned by digest.
    repository: image-registry.openshift-image-registry.svc:5000/mias-monitoring/blackbox-exporter
    digest: sha256:22def1f1843206a9dc6bf476533c16c025d0594ad2867778368a1735b87c7d38
    versionLabel: v0.28.0
    pullPolicy: IfNotPresent
  interval: 30s
  scrapeTimeout: 15s
  probeTimeout: 10s
  tls:
    # TEMPORARY: the lab ingress certificate is self-signed. Set to false once trusted TLS is in place.
    insecureSkipVerify: true
  # Egress to the router: the cluster ingress VIP (keepalived) that the Route host resolves to inside the cluster.
  # Routers are host-network pods, so this is an ipBlock (one address, TCP 443 only). Verify after network changes.
  ingressVIP: 192.168.5.141/32
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

ui:
  # Phase 16B: the read-only dashboard (static files + a same-origin nginx proxy to the in-namespace mias-api
  # Service). Deployed in Phase 16F. There is no token anywhere in the chart: each browser user enters the read
  # token, held only in that tab's memory, and nginx passes the browser's own Authorization header through.
  # Rollback: --set ui.enabled=false removes every mias-ui object (and the mias-api-allow-ui policy) only.
  enabled: true
  image:
    # Built from merged main 90effc1778a7612e8a708194644b46b79db09641 (OCI revision label); pushed to the internal
    # registry. (Earlier 16F images: 71dbb3de09d9 / sha256:b311627d…, 7c344762fbdd / sha256:03782545….)
    repository: image-registry.openshift-image-registry.svc:5000/mias/mias-ui
    digest: sha256:8c4e93412a62f3d9d9e696e531b56afa7847959e55a3c774ea85fe0dd4988cd0
    versionLabel: 90effc1778a7          # app.kubernetes.io/version only; never used to pull
    pullPolicy: IfNotPresent
  # Hardening Task 5: the UI is stateless (no volume, no server-side session, router cookies off), so it scales
  # independently of the RWO-bound API. Two replicas on different workers survive one pod or node failure.
  replicaCount: 2
  # Voluntary disruptions (drains, evictions) keep at least one UI pod. Rendered only with 2+ replicas: with one
  # replica a minAvailable of 1 would block every node drain.
  pdb:
    enabled: true
    minAvailable: 1
  # Spread UI pods across worker nodes (topology key kubernetes.io/hostname, maxSkew 1). DoNotSchedule makes the
  # spread strict; the lab has three untainted workers, so two replicas plus one surge pod always fit. Use
  # ScheduleAnyway if fewer than two workers can take UI pods. No zone spread: the nodes carry no zone labels.
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule
  api:
    # The proxy upstream. nginx's resolver ignores search domains, so this must be a fully qualified name.
    # Empty: mias-api.<release namespace>.svc.<clusterDomain>:8080.
    upstream: ""
    clusterDomain: cluster.local
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tmp:
    sizeLimit: 16Mi
  route:
    enabled: true
    host: mias-ui.apps.ngc.sirii.org
    tls:
      externalCertificateSecret: mias-ui-tls   # out-of-band Secret (see route.tls above)

# Shared proxy settings for /api/v1/ and /health/ (read-only API: GET and HEAD only).
limit_except GET {
    deny all;
}
# With a variable and no URI part, the original request URI (path and query) is passed unchanged.
proxy_pass $mias_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_intercept_errors off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
include /opt/mias-ui/etc/security-headers.conf;
